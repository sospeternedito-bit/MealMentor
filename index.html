--bg:#1a1611;--card:#241f19;--ink:#f3ead9;--muted:#a79a86;--line:#3a3228;

body{margin:0;background:

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---- IndexedDB ---- */
let DB;const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('meal-mentor',1);
 r.onupgradeneeded=()=>{const d=r.result;['modules','files','milestones','assignments','notes','queue','meta'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(s,m='readonly')=>DB.transaction(s,m).objectStore(s);
const put=(s,v)=>new Promise(r=>{tx(s,'readwrite').put(v).onsuccess=r});
const del=(s,id)=>new Promise(r=>{tx(s,'readwrite').delete(id).onsuccess=r});
const all=s=>new Promise(r=>{const o=[];tx(s).openCursor().onsuccess=e=>{const c=e.target.result;if(c){o.push(c.value);c.continue()}else r(o)}});
const get=(s,id)=>new Promise(r=>{tx(s).get(id).onsuccess=e=>r(e.target.result)});
const nid=()=>Date.now()+Math.random().toString(36).slice(2,6);

/* ---- content: 9 modules, abbreviated offline notes ---- */
const MODULES=[
{id:'m1',t:'Foundations',n:'Project cycle (design→implement→monitor→evaluate→learn), Theory of Change, logframes.',
 detail:'Every programme runs on a cycle: design, implement, monitor, evaluate, learn — then the learning feeds the next design. A Theory of Change (ToC) makes the logic explicit: it names your assumptions about how change happens, not just the activities. A logframe turns that logic into a table: goal, purpose, outputs, activities, each with indicators — so everyone can check progress against the same yardstick.',
 flow:[['Inputs','Budget, staff, partners — what you put in.'],['Activities','What you actually do: trainings, disbursements, campaigns.'],['Outputs','The direct, countable result of activities — e.g. bursaries disbursed.'],['Outcomes','The change in behaviour or condition that outputs should cause — e.g. retention in school.'],['Impact','The long-term, broader change — e.g. county literacy improves.']],
 ex:'County bursary fund ToC: inputs (budget, officers) → activities (application review, disbursement) → outputs (bursaries paid) → outcome (students stay enrolled) → impact (higher county completion rate). The assumption linking output to outcome: families use the bursary for fees, not other costs.',
 q:['Draw a ToC for a programme you know.','What is the difference between an output and an outcome?','Why do logframes include assumptions, and what happens if one fails?'],
 ans:['A ToC is yours to draw — check that each arrow states *why* one level leads to the next, not just *that* it does.','An output is what the programme directly produces and controls (e.g. training sessions held); an outcome is the change in people that the output is meant to cause, which the programme only influences (e.g. skills used in a new job).','Assumptions are the conditions outside your control that the logic depends on. If one fails — e.g. families redirect bursary money — outputs can rise while outcomes stall, so it is worth monitoring assumptions, not only indicators.']},
{id:'m2',t:'Resource Mobilisation',n:'Donor mapping, funding mechanisms, concept notes vs full proposals.',
 detail:'Resource mobilisation starts with knowing the landscape: who funds your sector, at what scale, and on what terms. A concept note is a short, persuasive first pitch (1–2 pages) that earns an invitation to submit a full proposal — it should never try to do the proposal\'s job of covering every detail.',
 flow:[['Map the field','Identify bilateral, multilateral, foundation and county/national funders active in your sector.'],['Match fit','Check each funder\'s priorities and ceiling against your programme.'],['Concept note','A tight pitch: the problem, your approach, the ask.'],['Full proposal','Expands the concept note: objectives, budget, M&E plan, risk.'],['Negotiate & report','Agree terms, then deliver against the reporting calendar.']],
 ex:'Kenya: the County Affirmative Action Fund, NGAAF and UWEZO Fund sit alongside donors like UNDP, FCDO and GIZ, who often co-fund county programmes through concept-note calls before a full proposal stage.',
 q:['List 3 funding mechanisms open to a Kenyan county department.','What goes in a concept note that a full proposal expands on?','Map two donors active in your sector and their priority areas.'],
 ans:['For example: county affirmative action funds, national government conditional grants, and bilateral/multilateral donor co-financing.','A concept note states the problem, your proposed approach and the funding ask in brief; the full proposal adds detailed objectives, a full budget, an M&E plan and risk analysis.','Your map is specific to your sector — the test is whether you can name their stated priorities, not just their name.']},
{id:'m3',t:'Indicators & M&E Plans',n:'SMART indicators, indicator types, M&E plan components.',
 detail:'An indicator is only useful if it is Specific, Measurable, Achievable, Relevant and Time-bound. An M&E plan turns each indicator into a tracking system: baseline, target, means of verification, frequency and who is responsible — without this table, indicators are just good intentions.',
 flow:[['Define the indicator','What exactly will you count or measure?'],['Set the baseline','Where does this stand today?'],['Set the target','What change, by when?'],['Means of verification','Where will the number come from?'],['Assign responsibility','Who collects it, how often?']],
 ex:'Indicator: "% of GBV survivors accessing recovery services within 48 hours." Baseline 40%, target 70% by year 2, verified via centre intake logs, reviewed quarterly by the M&E officer.',
 q:['Write one SMART indicator for a youth employment programme.','What is a means of verification, and why does it matter?','Why set a baseline before a target?'],
 ans:['Check it against all five letters — e.g. "% of enrolled youth employed within 6 months of training completion" is specific and time-bound; add your own target and measurement source.','It is the actual source of the data (a register, a survey, a report) — without naming it, an indicator cannot be audited or trusted.','Without a baseline, a target is a guess rather than a measured change — you cannot tell if you moved the needle or just described where you hoped to land.']},
{id:'m4',t:'Budgeting & Donor Reporting',n:'Budget types, variance, narrative vs financial reporting.',
 detail:'Budgets are either line-item (by cost category) or activity-based (by what the money achieves) — most donors want to see both. Variance is the gap between planned and actual spend; most donors only require an explanation once variance crosses a set threshold. Reporting then has two halves that must agree: the narrative tells the story, the financials prove it.',
 flow:[['Plan the budget','Line items and/or activities, with an indirect cost rate.'],['Track spend','Compare actual to planned monthly.'],['Flag variance','Explain any gap past the donor\'s threshold.'],['Narrative report','What happened, what changed, what\'s next.'],['Financial report','The numbers that back the narrative.']],
 ex:'A donor requires quarterly reports with a 10% variance threshold — spend 12% under on a training line, and the next report must explain why (e.g. a venue cost fell through).',
 q:['What is budget variance and why track it?','Name two things a narrative report covers that a financial one does not.','Why might a donor set a variance threshold instead of requiring an explanation for any change?'],
 ans:['Variance is the difference between budgeted and actual spend; tracking it catches problems (under-delivery, overspend) early enough to correct course mid-grant.','A narrative covers what was achieved, challenges faced and lessons learned — context a spreadsheet cannot carry.','A threshold keeps reporting proportionate — minor, expected fluctuations don\'t need justification, so attention goes to variances big enough to signal a real issue.']},
{id:'m5',t:'Research Design',n:'Quant vs qual vs mixed methods, sampling, validity.',
 detail:'The method should follow the question. Quantitative work answers "how much/how many," qualitative answers "why/how," and mixed methods combine both when a number alone would mislead. Sampling decides whose data you collect — probability sampling lets you generalise, non-probability sampling trades that for depth or access.',
 flow:[['Pose the question','What do you actually need to know?'],['Pick the design','Quant, qual, or mixed — and why.'],['Choose sampling','Who, how many, how selected.'],['Check validity','Does it measure what you intend?'],['Check reliability','Would it give consistent results if repeated?']],
 ex:'A quasi-experimental design compares bursary recipients to a matched non-recipient group in similar sub-counties — close to a true experiment, without random assignment, which would be hard to justify ethically here.',
 q:['When would you choose mixed methods over quant alone?','Define sampling frame.','What is the difference between validity and reliability?'],
 ans:['When numbers alone can\'t explain why an effect happened — e.g. enrolment dropped, and you need qualitative interviews to understand the cause behind the statistic.','The sampling frame is the actual list or source you draw your sample from — e.g. a county\'s bursary applicant register.','Validity asks whether you are measuring the right thing; reliability asks whether the measurement is consistent. A tool can be reliable but invalid (consistently measuring the wrong thing).']},
{id:'m6',t:'Data Collection',n:'Survey/KII/FGD tools, digital tools, ethics.',
 detail:'Pick the tool to match the question and the respondent: structured surveys for breadth, Key Informant Interviews (KIIs) for expert depth, Focus Group Discussions (FGDs) for shared/contested views, observation when self-report is unreliable. Every method needs informed consent and a data protection plan before a single response is collected.',
 flow:[['Design the tool','Survey, KII guide, FGD guide, or observation checklist.'],['Pilot it','Test with a small group, fix confusing questions.'],['Get consent','Explain purpose, risks, and how data will be used.'],['Collect','In person or via a digital tool.'],['Secure the data','Store and anonymise appropriately.']],
 ex:'A KoboToolbox form for household bursary verification, with GPS tagging and photo capture, is widely used across Kenyan counties for field data collection, even with intermittent connectivity.',
 q:['What ethical steps are needed before a household survey?','Compare a KII and an FGD.','Why pilot a data collection tool before full rollout?'],
 ans:['At minimum: informed consent, clarity on how data will be used and stored, and a way to protect respondent identity where sensitive information is involved.','A KII is a one-on-one conversation with someone who has specific expertise or authority; an FGD draws out shared or contrasting views from a group, useful when group dynamics matter.','Piloting catches confusing wording, technical glitches and timing issues before they corrupt your full dataset — a cheap fix before data collection versus an expensive one after.']},
{id:'m7',t:'Statistics & Demography',n:'Descriptive stats, demographic indicators, disaggregation.',
 detail:'Descriptive statistics (mean, median, mode, standard deviation) summarise a dataset in a few numbers. Demographic indicators — fertility rate, mortality rate, dependency ratio — describe a population\'s structure. Disaggregating by sex, age or county is often where the real policy insight hides, since a county-wide average can mask sharp local gaps.',
 flow:[['Collect raw data','Numbers from your survey or admin records.'],['Summarise','Mean, median, mode, spread.'],['Disaggregate','By sex, age, county, or other relevant group.'],['Compare to demographics','Fertility, mortality, dependency ratio context.'],['Interpret','What does the pattern mean for your programme?']],
 ex:'KNBS 2019 census data lets a county disaggregate bursary reach by sub-county and age group, often revealing that an apparently even county average hides sharp gaps between sub-counties.',
 q:['What does dependency ratio tell a planner?','When is median more useful than mean?','Why disaggregate data by county rather than reporting a national or county-wide average alone?'],
 ans:['It shows how many dependents (children and elderly) each working-age person supports — a high ratio signals pressure on the working population and on services.','When the data has outliers or is skewed, the median isn\'t pulled off-centre the way the mean is — e.g. a few very high incomes won\'t distort a median income figure.','Averages can hide sharp disparities between areas — a county average can look fine while specific sub-counties are badly underserved, which disaggregation reveals.']},
{id:'m8',t:'Data Management & Software',n:'Cleaning, coding, storage, software tools.',
 detail:'Raw data is rarely usable as collected: cleaning catches duplicate entries, impossible values and inconsistent coding before analysis begins. The right tool depends on scale and need — spreadsheets for small datasets, SPSS/R for statistical analysis, Power BI for live dashboards.',
 flow:[['Clean','Remove duplicates, fix impossible values.'],['Code','Standardise categories (e.g. consistent sub-county names).'],['Store securely','Backed up, access-controlled.'],['Analyse','Spreadsheet, SPSS, or R depending on scale.'],['Visualise','Dashboards for ongoing county reporting.']],
 ex:'A county M&E dashboard built in Power BI, pulling from a KoboToolbox-linked database, lets officers see bursary disbursement in near real time rather than waiting for a quarterly report.',
 q:['What is data cleaning and why does it matter?','Name one free tool for statistical analysis.','What is the risk of skipping data cleaning before analysis?'],
 ans:['Data cleaning is correcting errors, duplicates and inconsistencies before analysis — skipping it means your conclusions can rest on faulty numbers without anyone noticing.','R is a strong free option (see the Library tab for a free R for Data Science resource).','Uncaught errors can silently distort your results — a few duplicate records or miscoded entries can shift an average or a trend without being visibly wrong.']},
{id:'m9',t:'Accountability & Learning',n:'Feedback mechanisms, adaptive management, knowledge management.',
 detail:'Accountability means the people a programme serves have a real channel to raise concerns and get a response — not just a suggestion box no one checks. Adaptive management closes the loop: using what you learn, including complaints, to actually change how the programme runs, rather than filing lessons away unused.',
 flow:[['Open a channel','Feedback line, complaints desk, community meetings.'],['Log it','Every piece of feedback recorded, not just the serious ones.'],['Review','Regular review — monthly or quarterly.'],['Adapt','Change the programme based on what you learned.'],['Share the learning','So the next design starts smarter.']],
 ex:'A GBV recovery centre\'s toll-free feedback line is reviewed monthly, and service changes — like adjusted opening hours — are made directly from what callers report, closing the loop visibly.',
 q:['What is adaptive management?','Design a simple feedback loop for a programme you support.','Why log minor complaints, not just serious ones?'],
 ans:['Adaptive management is deliberately changing a programme\'s design or delivery based on ongoing evidence and feedback, rather than waiting for a fixed evaluation point.','Yours will vary — check it has an intake channel, a review cadence, and a visible step where a change is actually made as a result.','Minor complaints often reveal patterns before they become serious ones — and logging everything also builds trust by showing the channel is genuinely used.']}];

const MILES=['Topic & gap','Problem statement','Objectives & questions','Literature review','Methodology','Data collection','Analysis','Findings','Conclusions','Final edit'];

let S={done:{},q:[],lib:{}};
async function load(){DB=await openDB();const m=await get('meta','s');if(m)S=Object.assign(S,m.v);
 for(const mo of MILES){if(!await get('milestones',mo))await put('milestones',{id:mo,text:'',notes:''})}
 render()}
const save=()=>put('meta',{id:'s',v:S});
function go(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));$('t-'+t).classList.add('on');
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render(t)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
function toast(t){const m=document.createElement('div');m.textContent=t;m.style='position:fixed;left:12px;right:12px;bottom:76px;background:var(--accent2);color:#fff;padding:10px 14px;border-radius:10px;z-index:9;font-size:13px';document.body.appendChild(m);setTimeout(()=>m.remove(),2500)}

async 
let courseView='',activeStep={},revealed={};
window.openModule=id=>{courseView=id;activeStep[id]=activeStep[id]??0;renderCourse()};
window.backToList=()=>{courseView='';renderCourse()};
window.setStep=(id,i)=>{activeStep[id]=i;renderCourse()};
window.toggleAns=k=>{revealed[k]=!revealed[k];renderCourse()};
function renderCourse(){
 if(!courseView){
  $('t-course').innerHTML='<h2>9 modules</h2>'+MODULES.map(m=>`<div class="card" style="cursor:pointer" onclick="openModule('${m.id}')"><div class="row" style="border:0;padding:0"><b>${esc(m.t)}</b><input type="checkbox" ${S.done[m.id]?'checked':''} onclick="event.stopPropagation()" onchange="S.done['${m.id}']=this.checked;save();renderCourse();render('dash')"></div><p style="font-size:13px;color:var(--muted);margin:6px 0 0">${esc(m.n)}</p><span class="pill">Open module →</span></div>`).join('');
  return;
 }
 const m=MODULES.find(x=>x.id===courseView),si=activeStep[m.id]||0,step=m.flow[si];
 $('t-course').innerHTML=`<button class="btn alt" onclick="backToList()">← All modules</button>
 <h2 style="margin-top:16px">${esc(m.t)}</h2>
 <div class="card"><p style="font-size:14px;line-height:1.5">${esc(m.detail)}</p></div>
 <h2>Interactive flow</h2>
 <div class="card"><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">${m.flow.map((f,i)=>`<button class="btn ${i===si?'':'alt'}" style="white-space:nowrap" onclick="setStep('${m.id}',${i})">${i+1}. ${esc(f[0])}</button>`).join('')}</div><div class="card" style="margin:10px 0 0;background:var(--chip);box-shadow:none"><b>${esc(step[0])}</b><p style="font-size:13px;margin:6px 0 0">${esc(step[1])}</p></div></div>
 <h2>Kenyan example</h2><div class="card">${esc(m.ex)}</div>
 <h2>Self-check</h2>
 ${m.q.map((q,i)=>{const k=m.id+i;return `<div class="card"><p style="font-size:13px;font-weight:600">${i+1}. ${esc(q)}</p>${revealed[k]?`<p style="font-size:13px;color:var(--muted)">${esc(m.ans[i])}</p><button class="btn alt" onclick="toggleAns('${k}')">Hide</button>`:`<button class="btn alt" onclick="toggleAns('${k}')">Show key idea</button>`}</div>`}).join('')}`;
}
async function render(which){
 const done=Object.values(S.done).filter(Boolean).length,cpct=Math.round(done/MODULES.length*100);
 const miles=await all('milestones'),mdone=miles.filter(x=>x.text.trim()).length,wpct=Math.round(mdone/MILES.length*100);
 if(!which||which==='dash'){
  $('t-dash').innerHTML=`<div class="card"><div class="k">Course progress</div><div class="bar"><i style="width:${cpct}%"></i></div><small>${done}/${MODULES.length} modules</small></div>
  <div class="card"><div class="k">Write-up progress</div><div class="bar"><i style="width:${wpct}%"></i></div><small>${mdone}/${MILES.length} milestones</small></div>
  <div class="card"><div class="k">Ask queue</div><div>${S.q.length} item${S.q.length===1?'':'s'} waiting${S.q.length?' — open Ask when online':''}</div></div>`;
 }
 if(!which||which==='course'){renderCourse()}
 if(!which||which==='lib'){
  const files=await all('files');
  $('t-lib').innerHTML=`<div class="card"><h2 style="font-size:15px;margin-top:0">Import a file</h2><input type="file" id="fimp"><select id="ftag" style="margin-top:8px">${MODULES.map(m=>`<option value="${m.id}">${esc(m.t)}</option>`).join('')}</select><button class="btn" style="margin-top:8px" onclick="impFile()">Add to library</button></div>
  <h2 style="font-size:15px">My files</h2>${files.length?files.map(f=>`<div class="row"><div><b>${esc(f.name)}</b><br><span class="pill">${esc((MODULES.find(m=>m.id===f.tag)||{}).t||'')}</span></div><div><button class="btn alt" onclick="openFile('${f.id}')">Open</button> <button class="btn alt" onclick="del('files','${f.id}').then(()=>render('lib'))">✕</button></div></div>`).join(''):'<div class="empty">No files yet</div>'}
  <h2 style="font-size:15px">Recommended resources</h2><div class="card">${LIB.map(([n,u])=>`<div class="row"><a href="${u}" target="_blank">${esc(n)}</a><input type="checkbox" ${S.lib[n]?'checked':''} onchange="S.lib['${n}']=this.checked;save()"></div>`).join('')}</div>`;
 }
 if(!which||which==='write'){
  $('t-write').innerHTML=miles.map((m,i)=>`<div class="card"><b>${i+1}. ${esc(MILES[i])}</b> ${m.text.trim()?'<span class="pill">done</span>':''}<textarea id="w${i}" placeholder="Draft / notes">${esc(m.text)}</textarea><button class="btn" style="margin-top:6px" onclick="saveMile(${i})">Save</button></div>`).join('');
 }
 if(!which||which==='assign'){
  const asg=await all('assignments');
  $('t-assign').innerHTML=`<div class="card"><input id="atitle" placeholder="Title"><input id="adue" type="date" style="margin-top:6px"><button class="btn" style="margin-top:8px" onclick="addAssign()">Add task</button></div>`+(asg.length?asg.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).map(a=>`<div class="row"><div><b>${esc(a.title)}</b><br><small>${esc(a.due||'no date')}</small></div><div><select onchange="setAssign('${a.id}',this.value)"><option ${a.status==='pending'?'selected':''}>pending</option><option ${a.status==='in progress'?'selected':''}>in progress</option><option ${a.status==='done'?'selected':''}>done</option></select> <button class="btn alt" onclick="del('assignments','${a.id}').then(()=>render('assign'))">✕</button></div></div>`).join(''):'<div class="empty">No tasks yet</div>');
 }
 if(!which||which==='notes'){
  const nn=await all('notes');
  $('t-notes').innerHTML=`<div class="card"><input id="ntitle" placeholder="Title"><textarea id="nbody" placeholder="Note" style="margin-top:6px"></textarea><select id="ntag" style="margin-top:6px"><option value="">No module tag</option>${MODULES.map(m=>`<option value="${m.id}">${esc(m.t)}</option>`).join('')}</select><button class="btn" style="margin-top:8px" onclick="addNote()">Save note</button></div>`+(nn.length?nn.reverse().map(n=>`<div class="card"><b>${esc(n.title)}</b> ${n.tag?`<span class="pill">${esc((MODULES.find(m=>m.id===n.tag)||{}).t||'')}</span>`:''}<p style="font-size:13px;white-space:pre-wrap">${esc(n.body)}</p><button class="btn alt" onclick="del('notes','${n.id}').then(()=>render('notes'))">Delete</button></div>`).join(''):'<div class="empty">No notes yet</div>');
 }
 if(!which||which==='ask'){
  $('t-ask').innerHTML=`<div class="card"><select id="amode"><option value="tutor">Tutor — explain / study guide</option><option value="super">Supervisor — feedback on my draft</option></select><textarea id="aq" placeholder="Your question or pasted draft section" style="margin-top:6px"></textarea><button class="btn" style="margin-top:8px" onclick="queueAsk()">Save to queue</button></div><h2 style="font-size:15px">Queue (send when online)</h2>`+(S.q.length?S.q.map((it,i)=>`<div class="card"><span class="pill">${it.mode==='super'?'supervisor':'tutor'}</span><p style="font-size:13px;white-space:pre-wrap">${esc(it.text)}</p><button class="btn" onclick="copyPrompt(${i})">Copy prompt for Claude</button> <button class="btn alt" onclick="removeAsk(${i})">Remove</button></div>`).join(''):'<div class="empty">Nothing queued</div>');
 }
 if(!which||which==='more'){
  $('t-more').innerHTML=`<div class="card"><button class="btn alt" id="themebtn">Theme: auto</button></div>
  <div class="card"><h2 style="font-size:15px;margin-top:0">Backup</h2><button class="btn" onclick="backup()">Export backup</button><input type="file" id="restf" style="margin-top:8px" accept="application/json"><button class="btn alt" style="margin-top:8px" onclick="restore()">Restore</button></div>
  <div class="card"><h2 style="font-size:15px;margin-top:0">Install on your phone</h2><p style="font-size:13px">Open your browser menu and choose "Add to Home screen". For offline use and true install, host this file on Netlify or GitHub Pages — ask me and I'll set that up.</p></div>`;
  $('themebtn').onclick=()=>{const cur=document.documentElement.dataset.theme;const nx=cur==='dark'?'light':cur==='light'?'':'dark';if(nx)document.documentElement.dataset.theme=nx;else delete document.documentElement.dataset.theme;$('themebtn').textContent='Theme: '+(nx||'auto');S.theme=nx;save()};
 }
}
window.saveMile=async i=>{await put('milestones',{id:MILES[i],text:$('w'+i).value,notes:''});render('write');render('dash')};
window.addAssign=async()=>{const t=$('atitle').value.trim();if(!t)return;await put('assignments',{id:nid(),title:t,due:$('adue').value,status:'pending'});$('atitle').value='';render('assign')};
window.setAssign=async(id,st)=>{const a=await get('assignments',id);a.status=st;await put('assignments',a)};
window.addNote=async()=>{const t=$('ntitle').value.trim();if(!t)return;await put('notes',{id:nid(),title:t,body:$('nbody').value,tag:$('ntag').value});render('notes')};
window.queueAsk=()=>{const t=$('aq').value.trim();if(!t)return;S.q.push({mode:$('amode').value,text:t});save();$('aq').value='';render('ask');render('dash')};
window.removeAsk=i=>{S.q.splice(i,1);save();render('ask');render('dash')};
window.copyPrompt=i=>{const it=S.q[i];const pre="You are an expert M&E academic supervisor and tutor. The learner works in resource mobilisation at a county government in Kenya and is preparing a Master's in M&E. Use Kenyan and East African examples. Be concise, practical and critical: ask probing questions, flag weaknesses, give clear next steps.\\n\\n"+(it.mode==='super'?'Give supervisor-style feedback (strengths, weaknesses, gaps, 3 next steps) on this draft:\\n\\n':'Explain / build a study guide for:\\n\\n')+it.text;
 navigator.clipboard.writeText(pre).then(()=>toast('Copied — paste into Claude')).catch(()=>toast('Could not copy — select and copy manually'))};
window.impFile=()=>{const f=$('fimp').files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{await put('files',{id:nid(),name:f.name,type:f.type,tag:$('ftag').value,data:r.result});toast('Added');render('lib')};r.readAsDataURL(f)};
window.openFile=async id=>{const f=await get('files',id);const w=window.open();w.document.write(`<title>${esc(f.name)}</title>`+(f.type.startsWith('image')?`<img src="${f.data}" style="max-width:100%">`:`<a href="${f.data}" download="${esc(f.name)}">Download ${esc(f.name)}</a>`))};
window.backup=async()=>{const data={};for(const s of['modules','files','milestones','assignments','notes','meta'])data[s]=await all(s);
 const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meal-mentor-backup.json';a.click()};
window.restore=()=>{const f=$('restf').files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{const d=JSON.parse(r.result);for(const s in d)for(const v of d[s])await put(s,v);toast('Restored');load()};r.readAsText(f)};
function net(){$('netstat').textContent=navigator.onLine?'🟢 Online':'⚪ Offline';$('netstat').title=navigator.onLine?'Ask tab can send to Claude':'Ask tab queues for later'}
window.addEventListener('online',net);window.addEventListener('offline',net);net();
if('storage' in navigator&&navigator.storage.persist)navigator.storage.persist();
load();
</script></body></html>
